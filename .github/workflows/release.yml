name: Build and Release

# Tag a commit to publish a release:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # Also allows a manual build from the Actions tab.

permissions:
  contents: write  # Required to create the release and upload the DMG.

jobs:
  build:
    # macos-14 and later are Apple Silicon, matching the arm64 build.
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt py2app

      - name: Verify version matches tag
        # A mismatch here means the release would be labelled wrongly, so
        # fail fast rather than publishing a confusingly named artifact.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          FILE_VERSION=$(grep -m1 '__version__ = ' caffeine_citrix.py | cut -d'"' -f2)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "File: $FILE_VERSION / Tag: $TAG_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::__version__ ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Generate icon
        run: python make_icon.py

      - name: Build app bundle
        run: python setup.py py2app

      - name: Sign (ad-hoc)
        # Mandatory on Apple Silicon: an unsigned bundle will not launch.
        run: |
          codesign --force --deep --sign - "dist/Caffeine for Citrix.app"
          codesign --verify --strict "dist/Caffeine for Citrix.app"

      - name: Smoke test
        # Catches bundle-only failures (missing dynamic imports, encoding
        # errors) that never show up running the script directly.
        run: |
          "dist/Caffeine for Citrix.app/Contents/MacOS/Caffeine for Citrix" > launch.log 2>&1 &
          APP_PID=$!
          sleep 6
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "::error::App exited during smoke test"
            cat launch.log
            exit 1
          fi
          kill $APP_PID 2>/dev/null || true
          # Match crashes only. A missing Accessibility grant is expected
          # on a CI runner and logs a WARNING, which must not fail the build.
          if grep -qE "Traceback|\\[ERROR\\]|UnicodeEncodeError" launch.log; then
            echo "::error::App logged an error on startup"
            cat launch.log
            exit 1
          fi
          echo "Smoke test passed"
          cat launch.log

      - name: Build DMG
        run: |
          VERSION=$(grep -m1 '__version__ = ' caffeine_citrix.py | cut -d'"' -f2)
          DMG="dist/CaffeineForCitrix-${VERSION}-arm64.dmg"
          STAGE=$(mktemp -d)
          cp -R "dist/Caffeine for Citrix.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Caffeine for Citrix" \
            -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          rm -rf "$STAGE"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaffeineForCitrix-dmg
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_PATH }}
          generate_release_notes: true
          body: |
            ## Install

            1. Download the `.dmg` below and open it.
            2. Drag **Caffeine for Citrix** to Applications.
            3. **Right-click the app → Open** on first launch (the build is
               ad-hoc signed, so Gatekeeper asks once).
            4. Grant Accessibility permission in
               **System Settings → Privacy & Security → Accessibility**,
               then quit and relaunch.

            > Apple Silicon (arm64) only. On Intel Macs, run from source —
            > see the [README](https://github.com/${{ github.repository }}#option-b--run-from-source).
